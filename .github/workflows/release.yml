name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PACKAGE: codebase-context-graph-macos-aarch64

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          cd rust-cli
          cargo build --release --locked

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          APP="$PACKAGE/Codebase Context Graph.app"

          # The app runs the command-line tool that sits next to it, so both go in the bundle.
          mkdir -p "$APP/Contents/MacOS"
          cp rust-cli/target/release/codebase-context-graph "$PACKAGE/"
          cp rust-cli/target/release/codebase-context-graph \
             rust-cli/target/release/codebase-context-graph-gui \
             "$APP/Contents/MacOS/"

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>codebase-context-graph-gui</string>
            <key>CFBundleIdentifier</key>
            <string>com.codebase-context-graph.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Codebase Context Graph</string>
            <key>CFBundleDisplayName</key>
            <string>Codebase Context Graph</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature: not a developer identity, but Apple Silicon expects signed code.
          codesign --force --deep --sign - "$APP"

          cat > "$PACKAGE/README.md" << 'EOF'
          # Codebase Context Graph

          Builds a queryable code graph (SQLite + JSON) from compiler-grade SCIP indexes:
          definitions, references and calls resolved by rust-analyzer, scip-typescript and
          scip-python.

          ## Requirements

          The indexers are separate programs. The app's "Check indexers" button, or
          `./codebase-context-graph doctor`, shows which are installed.

          - Rust: `rustup component add rust-analyzer`
          - TypeScript / JavaScript: `npm install -g @sourcegraph/scip-typescript`
          - Python: `npm install -g @sourcegraph/scip-python`

          ## Desktop app

          Open **Codebase Context Graph.app**, choose a project folder and press
          **Index project**. If macOS refuses to open the app because the archive was
          downloaded in a browser, run this once:

              xattr -dr com.apple.quarantine "Codebase Context Graph.app"

          ## Command line

              ./codebase-context-graph doctor --project-root /path/to/project   # which indexers are installed
              ./codebase-context-graph index  --project-root /path/to/project   # build the graph
              ./codebase-context-graph serve  --project-root /path/to/project   # answer queries as JSON lines (not MCP)

          Results are written to `.codebase-context/` inside the project (`graph.db` and
          `graph.json`). Documentation: https://github.com/mblando9988/Codebase-Context-Graph

          ## License

          MIT
          EOF

          COPYFILE_DISABLE=1 tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE }}.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Codebase Context Graph

            Builds a queryable code graph (SQLite + JSON) from compiler-grade SCIP indexes:
            rust-analyzer, scip-typescript and scip-python.

            ### Install (macOS, Apple Silicon)

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.PACKAGE }}.tar.gz | tar -xz
            cd ${{ env.PACKAGE }}
            open "Codebase Context Graph.app"
            ```

            The indexers are separate programs; `./codebase-context-graph doctor` shows which
            are installed. See the README for details.
